[package]
name = "mayerdock"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Dock lateral Windows que reserva uma faixa da tela (AppBar) e encaixa janelas"
license = "MIT"

[dependencies]
# Win32 puro: AppBar (SHAppBarMessage), janelas, GDI, DPI, shell.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
strip = true
